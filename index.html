<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/public/apps/oscadia/manifest.json">
<meta name="theme-color" content="#0b4fd8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>OSCADIA</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial,"Noto Sans KR",sans-serif;
    color:#202124;
    background:#fff;
}

/* HEADER */

header{
    min-height:64px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:10px 28px;
    border-bottom:1px solid #eee;
    background:#fff;
    position:relative;
    z-index:100;
}

.logo{
    flex:0 0 auto;
    font-size:25px;
    font-weight:700;
    letter-spacing:-1px;
    cursor:pointer;
    white-space:nowrap;
}

/* ADDRESS */

.os-cadia-address-bar{
    flex:1;
    min-width:0;
    max-width:600px;
    display:flex;
    align-items:center;
    gap:6px;
}

.os-cadia-address-bar input{
    flex:1;
    min-width:0;
    height:40px;
    border:1px solid #dfe1e5;
    border-radius:20px;
    padding:0 15px;
    outline:none;
    font-size:14px;
    background:#f8f9fa;
}

.os-cadia-address-bar input:focus{
    border-color:#aaa;
    background:#fff;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.os-cadia-address-bar button{
    height:40px;
    padding:0 15px;
    border:0;
    border-radius:20px;
    background:#222;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
}

.os-cadia-address-bar button:hover{
    background:#444;
}

/* NAV */

nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
}

nav button{
    border:0;
    background:#fff;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    white-space:nowrap;
}

nav button:hover{
    background:#f1f3f4;
}

/* PROFILE */

.profile-button{
    display:flex;
    align-items:center;
    gap:7px;
}

.profile-avatar-small{
    width:27px;
    height:27px;
    border-radius:50%;
    object-fit:cover;
    background:#e8eaed;
    display:none;
}

.profile-button.logged-in .profile-avatar-small{
    display:block;
}

.profile-name{
    max-width:100px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* SERVICES BUTTON */

.service-button{
    width:42px;
    height:42px;
    padding:0;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.service-dots{
    width:18px;
    height:18px;
    display:grid;
    grid-template-columns:repeat(3,4px);
    grid-template-rows:repeat(3,4px);
    gap:3px;
}

.service-dots span{
    width:4px;
    height:4px;
    background:#444;
    border-radius:50%;
}

/* PANELS */

.side-panel{
    position:fixed;
    top:0;
    right:0;
    width:350px;
    max-width:92vw;
    height:100vh;
    background:#fff;
    box-shadow:-8px 0 30px rgba(0,0,0,.14);
    z-index:1000;
    transform:translateX(110%);
    transition:transform .22s ease;
    overflow-y:auto;
}

.side-panel.open{
    transform:translateX(0);
}

.panel-header{
    height:70px;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:2;
}

.panel-title{
    font-size:20px;
    font-weight:700;
}

.panel-close{
    width:38px;
    height:38px;
    border:0;
    background:#f1f3f4;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.panel-content{
    padding:22px;
}

.panel-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.22);
    z-index:900;
    display:none;
}

.panel-overlay.show{
    display:block;
}

/* PROFILE PANEL */

.profile-card{
    text-align:center;
    padding:10px 0 25px;
    border-bottom:1px solid #eee;
}

.profile-avatar-large{
    width:82px;
    height:82px;
    border-radius:50%;
    object-fit:cover;
    background:#eef1f5;
    margin-bottom:12px;
}

.profile-card-name{
    font-size:20px;
    font-weight:700;
}

.profile-card-id{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.login-message{
    text-align:center;
    padding:25px 0;
    color:#666;
    line-height:1.6;
}

.panel-action{
    width:100%;
    min-height:48px;
    border:0;
    background:#fff;
    border-radius:10px;
    text-align:left;
    padding:12px 14px;
    cursor:pointer;
    font-size:15px;
    margin-top:6px;
}

.panel-action:hover{
    background:#f5f6f7;
}

.panel-action.danger{
    color:#d93025;
}

/* SERVICE PANEL */

.service-list{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.service-item{
    display:flex;
    align-items:center;
    gap:13px;
    width:100%;
    min-height:62px;
    padding:9px 12px;
    border:0;
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    text-align:left;
}

.service-item:hover{
    background:#f5f6f7;
}

.service-icon{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#f1f3f4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:700;
    flex:0 0 auto;
}

.service-info{
    min-width:0;
}

.service-name{
    font-size:15px;
    font-weight:600;
}

.service-description{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

/* MAIN */

main{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:120px 20px 50px;
}

.brand{
    text-align:center;
    font-size:58px;
    font-weight:700;
    letter-spacing:-3px;
    margin-bottom:35px;
}

/* SEARCH */

.search-box{
    position:relative;
    width:min(680px,100%);
    margin:0 auto;
}

.search-box input{
    width:100%;
    height:55px;
    border:1px solid #dfe1e5;
    border-radius:28px;
    padding:0 60px 0 22px;
    font-size:17px;
    outline:none;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.search-box input:focus{
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.search-button{
    position:absolute;
    right:7px;
    top:7px;
    width:41px;
    height:41px;
    border:0;
    border-radius:50%;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.search-button:hover{
    background:#444;
}

/* SUGGESTIONS */

.suggestions{
    position:absolute;
    left:0;
    right:0;
    top:calc(100% + 8px);
    background:#fff;
    border:1px solid #e1e4e8;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    overflow:hidden;
    display:none;
    z-index:50;
}

.suggestions.show{
    display:block;
}

.suggestion-item{
    min-height:44px;
    padding:11px 18px;
    display:flex;
    align-items:center;
    cursor:pointer;
    font-size:14px;
}

.suggestion-item:hover{
    background:#f5f6f7;
}

/* SHORTCUTS */

.shortcuts{
    width:min(680px,100%);
    margin:32px auto 0;
}

.shortcuts-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.shortcuts-title{
    font-size:14px;
    font-weight:600;
    color:#555;
}

.add-shortcut-button{
    border:0;
    background:#f1f3f4;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
}

.shortcut-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.shortcut-item{
    width:105px;
    min-height:82px;
    border:1px solid #eee;
    border-radius:12px;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    cursor:pointer;
    position:relative;
}

.shortcut-item:hover{
    background:#f7f8f9;
}

.shortcut-icon{
    width:31px;
    height:31px;
    border-radius:8px;
    background:#f1f3f4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
}

.shortcut-name{
    max-width:85px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
}

.shortcut-delete{
    position:absolute;
    top:4px;
    right:5px;
    border:0;
    background:transparent;
    color:#888;
    cursor:pointer;
    display:none;
}

.shortcut-item:hover .shortcut-delete{
    display:block;
}

/* AI */

.ai-overview{
    margin-top:45px;
    padding:20px;
    border:1px solid #e1e5ea;
    border-radius:15px;
    background:#fafbfc;
    display:none;
}

.ai-overview.show{
    display:block;
}

.ai-overview-title{
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
}

.ai-overview-text{
    color:#555;
    line-height:1.65;
    font-size:14px;
}

/* RESULTS */

.results{
    margin-top:35px;
}

.info{
    color:#777;
    font-size:13px;
    margin-bottom:20px;
}

.result{
    padding:17px 0;
    border-bottom:1px solid #eee;
}

.result a{
    color:#174ea6;
    text-decoration:none;
}

.result a:hover{
    text-decoration:underline;
}

.result-title{
    font-size:19px;
    margin-bottom:6px;
    word-break:break-word;
}

.result-url{
    color:#188038;
    font-size:13px;
    margin-bottom:6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.result-description{
    color:#5f6368;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.empty,
.loading{
    text-align:center;
    padding:50px 10px;
    color:#777;
}

/* HISTORY */

.history-title{
    font-size:13px;
    color:#777;
    margin:20px 0 8px;
}

.history-item{
    width:100%;
    padding:11px 10px;
    border:0;
    background:#fff;
    border-radius:8px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.history-item:hover{
    background:#f5f6f7;
}

.clear-history{
    margin-top:15px;
    border:0;
    background:#f1f3f4;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);
    background:#fff;
    border-radius:17px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-title{
    font-size:19px;
    font-weight:700;
    margin-bottom:18px;
}

.modal-box input{
    width:100%;
    height:44px;
    border:1px solid #dfe1e5;
    border-radius:9px;
    padding:0 12px;
    outline:none;
    margin-bottom:10px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:10px;
}

.modal-actions button{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
}

.modal-cancel{
    background:#f1f3f4;
}

.modal-confirm{
    background:#222;
    color:#fff;
}

/* MOBILE */

@media(max-width:700px){

    header{
        min-height:auto;
        flex-wrap:wrap;
        gap:10px;
        padding:12px 15px;
    }

    .logo{
        font-size:22px;
    }

    .os-cadia-address-bar{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    nav{
        margin-left:auto;
    }

    nav button{
        padding:8px 10px;
    }

    .profile-name{
        max-width:60px;
    }

    main{
        padding:75px 15px 40px;
    }

    .brand{
        font-size:45px;
        letter-spacing:-2px;
        margin-bottom:28px;
    }

    .search-box input{
        height:52px;
        font-size:16px;
    }

    .result-title{
        font-size:17px;
    }

    .result-description{
        font-size:13px;
    }

    .shortcut-item{
        width:calc(25% - 8px);
        min-width:70px;
    }
}

@media(max-width:420px){

    .brand{
        font-size:38px;
    }

    .profile-name{
        display:none;
    }

    .shortcut-item{
        width:calc(33.333% - 7px);
    }
}
</style>
</head>

<body>

<header>

    <div class="logo" onclick="location.href='/'">
        OSCADIA
    </div>

    <div class="os-cadia-address-bar">

        <input
            id="osAddressInput"
            type="text"
            placeholder="웹 주소를 입력하세요"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="osAddressGo" type="button">
            이동
        </button>

    </div>

    <nav>

        <button type="button" onclick="openOSmail()">
            OSmail
        </button>

        <button
            id="profileButton"
            class="profile-button"
            type="button"
            onclick="toggleProfilePanel()"
        >

            <img
                id="profileAvatarSmall"
                class="profile-avatar-small"
                alt=""
            >

            <span id="profileName" class="profile-name">
                로그인
            </span>

        </button>

        <button
            id="serviceButton"
            class="service-button"
            type="button"
            onclick="toggleServicePanel()"
            aria-label="OSCADIA 서비스"
        >

            <span class="service-dots">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </span>

        </button>

    </nav>

</header>

<div
    id="panelOverlay"
    class="panel-overlay"
    onclick="closePanels()"
></div>

<aside id="profilePanel" class="side-panel">

    <div class="panel-header">

        <div class="panel-title">
            계정
        </div>

        <button
            class="panel-close"
            type="button"
            onclick="closePanels()"
        >
            ×
        </button>

    </div>

    <div
        id="profilePanelContent"
        class="panel-content"
    ></div>

</aside>

<aside id="servicePanel" class="side-panel">

    <div class="panel-header">

        <div class="panel-title">
            OSCADIA 서비스
        </div>

        <button
            class="panel-close"
            type="button"
            onclick="closePanels()"
        >
            ×
        </button>

    </div>

    <div class="panel-content">

        <div
            id="serviceList"
            class="service-list"
        ></div>

    </div>

</aside>

<main>

    <div class="brand">
        OSCADIA
    </div>

    <div class="search-box">

        <input
            id="query"
            type="search"
            placeholder="웹 검색"
            autocomplete="off"
        >

        <button
            class="search-button"
            type="button"
            onclick="search()"
            aria-label="검색"
        >
            ⌕
        </button>

        <div
            id="suggestions"
            class="suggestions"
        ></div>

    </div>

    <section id="shortcuts" class="shortcuts">

        <div class="shortcuts-header">

            <div class="shortcuts-title">
                바로가기
            </div>

            <button
                class="add-shortcut-button"
                type="button"
                onclick="openShortcutModal()"
            >
                + 추가
            </button>

        </div>

        <div
            id="shortcutList"
            class="shortcut-list"
        ></div>

    </section>

    <section
        id="aiOverview"
        class="ai-overview"
    >

        <div class="ai-overview-title">
            AI 개요
        </div>

        <div
            id="aiOverviewText"
            class="ai-overview-text"
        ></div>

    </section>

    <div id="results" class="results"></div>

</main>

<div id="shortcutModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            바로가기 추가
        </div>

        <input
            id="shortcutName"
            type="text"
            placeholder="사이트 이름"
            maxlength="30"
        >

        <input
            id="shortcutUrl"
            type="url"
            placeholder="https://example.com"
        >

        <div class="modal-actions">

            <button
                class="modal-cancel"
                type="button"
                onclick="closeShortcutModal()"
            >
                취소
            </button>

            <button
                class="modal-confirm"
                type="button"
                onclick="addShortcut()"
            >
                추가
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const OSCADIA_API =
    "https://oscadia-api.onrender.com";

const SUPABASE_URL =
    "https://mujmwouyopgxwtezhlzv.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_uiChi46cHC53f6QAm8TALQ_MGknEOQ9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

let oscadiaUser = null;
let oscadiaProfile = null;

/* =========================
   ELEMENTS
========================= */

const queryInput =
    document.getElementById("query");

const suggestions =
    document.getElementById("suggestions");

const results =
    document.getElementById("results");

const profilePanel =
    document.getElementById("profilePanel");

const servicePanel =
    document.getElementById("servicePanel");

const panelOverlay =
    document.getElementById("panelOverlay");

/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(value){
    return escapeHtml(value);
}

/* =========================
   OSMAIL
========================= */

function openOSmail(){

    location.href =
        "public/osmail.html";
}

function openOSmailLogin(){

    location.href =
        "public/osmail.html?return=oscadia&login=1";
}

/* =========================
   AUTH
========================= */

async function loadOSmailSession(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();

        if(error){
            console.error(
                "OSmail 세션 오류:",
                error
            );

            oscadiaUser = null;
            oscadiaProfile = null;

            renderProfileButton();
            return;
        }

        oscadiaUser =
            data.session?.user || null;

        if(!osccadiaLoggedIn()){

            oscadiaProfile = null;

            renderProfileButton();
            return;
        }

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
            .from("osmail_profiles")
            .select("*")
            .eq("id",oscadiaUser.id)
            .maybeSingle();

        if(profileError){

            console.error(
                "OSmail 프로필 오류:",
                profileError
            );

            oscadiaProfile = null;

        }else{

            oscadiaProfile = profile;
        }

        renderProfileButton();

    }catch(error){

        console.error(
            "로그인 상태 확인 오류:",
            error
        );

        oscadiaUser = null;
        oscadiaProfile = null;

        renderProfileButton();
    }
}

function osccadiaLoggedIn(){
    return !!oscadiaUser;
}

function isLoggedIn(){
    return !!oscadiaUser;
}

/* =========================
   PROFILE BUTTON
========================= */

function renderProfileButton(){

    const button =
        document.getElementById(
            "profileButton"
        );

    const name =
        document.getElementById(
            "profileName"
        );

    const avatar =
        document.getElementById(
            "profileAvatarSmall"
        );

    if(!oscadiaUser){

        button.classList.remove(
            "logged-in"
        );

        name.textContent =
            "로그인";

        avatar.removeAttribute("src");

        return;
    }

    button.classList.add(
        "logged-in"
    );

    name.textContent =
        oscadiaProfile?.display_name ||
        oscadiaProfile?.osmail_id ||
        oscadiaUser.email ||
        "사용자";

    const avatarUrl =
        oscadiaProfile?.avatar_url ||
        oscadiaProfile?.profile_image ||
        oscadiaProfile?.avatar ||
        "";

    if(avatarUrl){

        avatar.src =
            avatarUrl;

    }else{

        avatar.removeAttribute("src");
    }
}

/* =========================
   PROFILE PANEL
========================= */

function toggleProfilePanel(){

    if(!isLoggedIn()){

        openOSmailLogin();
        return;
    }

    closePanels();

    profilePanel.classList.add("open");
    panelOverlay.classList.add("show");

    renderProfilePanel();
}

function renderProfilePanel(){

    const container =
        document.getElementById(

/* =========================
   HISTORY STORAGE
========================= */

function getHistoryKey(type){

    if(!oscadiaUser){
        return "oscadia_" + type + "_guest";
    }

    return (
        "oscadia_" +
        type +
        "_" +
        oscadiaUser.id
    );
}

/* =========================
   SEARCH HISTORY
========================= */

function getSearchHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                getHistoryKey("search_history")
            ) || "[]"
        );

    }catch{

        return [];
    }
}

function saveSearchHistory(value){

    if(!isLoggedIn()){
        return;
    }

    let history =
        getSearchHistory();

    history =
        history.filter(
            item => item !== value
        );

    history.unshift(value);

    history =
        history.slice(0,30);

    localStorage.setItem(
        getHistoryKey("search_history"),
        JSON.stringify(history)
    );
}

function showSearchHistory(){

    if(!isLoggedIn()){
        return;
    }

    const area =
        document.getElementById(
            "profileHistoryArea"
        );

    const history =
        getSearchHistory();

    if(!history.length){

        area.innerHTML = `
            <div class="history-title">
                검색 기록이 없습니다.
            </div>
        `;

        return;
    }

    area.innerHTML = `

        <div class="history-title">
            최근 검색
        </div>

        ${history.map(
            item => `

                <button
                    class="history-item"
                    type="button"
                    onclick="searchFromHistory('${escapeAttribute(
                        item
                    )}')"
                >
                    ${escapeHtml(item)}
                </button>

            `
        ).join("")}

        <button
            class="clear-history"
            type="button"
            onclick="clearSearchHistory()"
        >
            검색 기록 전체 삭제
        </button>
    `;
}

function searchFromHistory(value){

    queryInput.value =
        value;

    closePanels();

    search();
}

function clearSearchHistory(){

    localStorage.removeItem(
        getHistoryKey("search_history")
    );

    showSearchHistory();
}

}

function saveVisitHistory(page){

    if(!isLoggedIn()){
        return;
    }

    let history =
        getVisitHistory();

    history =
        history.filter(
            item => item.url !== page.url
        );

    history.unshift({

        title:
            page.title ||
            page.url,

        url:
            page.url,

        time:
            new Date().toISOString()

    });

    history =
        history.slice(0,50);

    localStorage.setItem(
        getHistoryKey("visit_history"),
        JSON.stringify(history)
    );
}

function showVisitHistory(){

/* =========================

========================= */

const SEARCH_SUGGESTIONS = [

    "google",
    "gmail",
    "google maps",
    "github",
    "youtube",
    "naver",
    "naver mail",
    "wikipedia",
    "instagram",
    "facebook",
    "chatgpt",
    "microsoft",
    "hotmail",
    "outlook"

];

queryInput.addEventListener(
    "input",
    showSuggestions
);

function showSuggestions(){

    const value =
        queryInput.value
            .trim()
            .toLowerCase();

    if(!value){

        suggestions.innerHTML = "";
        suggestions.classList.remove("show");

        return;
    }

    const matches =
        SEARCH_SUGGESTIONS
            .filter(
                item =>
                    item.toLowerCase()
                        .includes(value)
            )
            .slice(0,6);

    if(!matches.length){

        suggestions.innerHTML = "";
        suggestions.classList.remove("show");

        return;
    }

    suggestions.innerHTML =
        matches.map(
            item => `

                <div
                    class="suggestion-item"
                    onclick="useSuggestion('${escapeAttribute(
                        item
                    )}')"
                >
                    ${escapeHtml(item)}
                </div>

            `
        ).join("");

    suggestions.classList.add("show");
}

function useSuggestion(value){

    queryInput.value =
        value;

    suggestions.classList.remove("show");

    search();
}

document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(".search-box")
        ){

            suggestions.classList.remove(
                "show"
            );
        }
    }
);

queryInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            suggestions.classList.remove(
                "show"
            );

            search();
        }
    }
);

/* =========================
   SEARCH
========================= */

async function search(){

    const q =
        queryInput.value.trim();

    const shortcuts =
        document.getElementById(
            "shortcuts"
        );

    if(!q){

        results.innerHTML = "";

        document
            .getElementById("aiOverview")
            .classList.remove("show");

        shortcuts.style.display = "";

        return;
    }

    shortcuts.style.display = "none";

    saveSearchHistory(q);

    results.innerHTML = `
        <div class="loading">
            검색 중...
        </div>
    `;

    try{

        const response =
            await fetch(
                OSCADIA_API +
                "/api/search?q=" +
                encodeURIComponent(q)
            );

        if(!response.ok){

            throw new Error(
                "Search failed: " +
                response.status
            );
        }

        const data =
            await response.json();

        renderResults(data);

        createAIOverview(
            q,
            data
        );

    }catch(error){

        console.error(
            "OSCADIA 검색 오류:",
            error
        );

        results.innerHTML = `
            <div class="empty">
                검색 서버에 연결할 수 없습니다.
            </div>
        `;
    }
}

/* =========================
   AI OVERVIEW
========================= */

function createAIOverview(
    query,
    data
){

    const box =
        document.getElementById(
            "aiOverview"
        );

    const text =
        document.getElementById(
            "aiOverviewText"
        );

    if(
        !data.results ||
        !data.results.length
    ){

        box.classList.remove("show");

        return;
    }

    const firstResults =
        data.results.slice(0,3);

    const summary =
        firstResults
            .map(
                page =>
                    page.title ||
                    page.description ||
                    ""
            )
            .filter(Boolean)
            .join(" · ");

    text.textContent =
        `"${query}"에 대한 검색 결과를 바탕으로 한 기본 개요입니다. ` +
        summary;

    box.classList.add("show");
}

/* =========================
   RESULTS
========================= */

function renderResults(data){

    if(
        !data.results ||
        data.results.length === 0
    ){

        results.innerHTML = `

            <div class="empty">
                "${escapeHtml(
                    data.query || ""
                )}"에 대한 검색 결과가 없습니다.
            </div>

        `;

        return;
    }

    let html = `

        <div class="info">
            검색 결과 ${data.count ?? data.results.length}개
        </div>

    `;

    html +=
        data.results
            .map(
                page => `

                    <div class="result">

                        <div class="result-title">

                            <a
                                href="${escapeAttribute(
                                    page.url
                                )}"
                                target="_blank"
                                rel="noopener noreferrer"
                                onclick="recordResultVisit(this)"
                            >
                                ${escapeHtml(
                                    page.title ||
                                    page.url
                                )}
                            </a>

                        </div>

                        <div class="result-url">
                            ${escapeHtml(page.url)}
                        </div>

                        <div class="result-description">
                            ${escapeHtml(
                                page.description ||
                                makeSnippet(page)
                            )}
                        </div>

                    </div>

                `
            )
            .join("");

    results.innerHTML =
        html;
}

function recordResultVisit(element){

    saveVisitHistory({

        title:
            element.textContent.trim() ||
            element.href,

        url:
            element.href

    });
}

function makeSnippet(page){

    const text =
        page.description ||
        page.content ||
        "";

    return text.slice(0,180);
}

/* =========================
   SHORTCUTS
========================= */

const DEFAULT_SHORTCUTS = [

    {
        name:"Google",
        url:"https://www.google.com"
    },

    {
        name:"YouTube",
        url:"https://www.youtube.com"
    },

    {
        name:"GitHub",
        url:"https://github.com"
    }

];

function getShortcuts(){

    try{

        const saved =
            localStorage.getItem(
                "oscadia_shortcuts"
            );

        if(saved){

            return JSON.parse(saved);
        }

    }catch(error){

        console.error(
            "바로가기 오류:",
            error
        );
    }

    return DEFAULT_SHORTCUTS;
}

function saveShortcuts(list){

    localStorage.setItem(
        "oscadia_shortcuts",
        JSON.stringify(list)
    );
}

function renderShortcuts(){

    const list =
        document.getElementById(
            "shortcutList"
        );

    const shortcuts =
        getShortcuts();

    list.innerHTML =
        shortcuts
            .map(
                (item,index) => `

                    <div
                        class="shortcut-item"
                        onclick="openShortcut('${escapeAttribute(
                            item.url
                        )}')"
                    >

                        <button
                            class="shortcut-delete"
                            type="button"
                            onclick="deleteShortcut(event,${index})"
                        >
                            ×
                        </button>

                        <div class="shortcut-icon">
                            ${escapeHtml(
                                getInitial(item.name)
                            )}
                        </div>

                        <div class="shortcut-name">
                            ${escapeHtml(item.name)}
                        </div>

                    </div>

                `
            )
            .join("");
}

function getInitial(name){

    return String(
        name || "?"
    )
    .charAt(0)
    .toUpperCase();
}

function openShortcut(url){

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}

function deleteShortcut(
    event,
    index
){

    event.stopPropagation();

    const list =
        getShortcuts();

    list.splice(index,1);

    saveShortcuts(list);

    renderShortcuts();
}

function openShortcutModal(){

    document
        .getElementById("shortcutModal")
        .classList.add("show");

    document
        .getElementById("shortcutName")
        .focus();
}

function closeShortcutModal(){

    document
        .getElementById("shortcutModal")
        .classList.remove("show");
}

function addShortcut(){

    const name =
        document
            .getElementById("shortcutName")
            .value
            .trim();

    let url =
        document
            .getElementById("shortcutUrl")
            .value
            .trim();

    if(!name || !url){

        alert(
            "사이트 이름과 주소를 입력하세요."
        );

        return;
    }

    if(!/^https?:\/\//i.test(url)){

        url =
            "https://" +
            url;
    }

    const list =
        getShortcuts();

    list.push({
        name:name,
        url:url
    });

    saveShortcuts(list);
    renderShortcuts();

    document
        .getElementById("shortcutName")
        .value = "";

    document
        .getElementById("shortcutUrl")
        .value = "";

    closeShortcutModal();
}

/* =========================
   ADDRESS BAR
========================= */

const addressInput =
    document.getElementById(
        "osAddressInput"
    );

const addressGo =
    document.getElementById(
        "osAddressGo"
    );

async function goAddress(){

    let value =
        addressInput.value.trim();

    if(!value){
        return;
    }

    if(!/^https?:\/\//i.test(value)){

        value =
            "https://" +
            value;
    }

    try{

        const response =
            await fetch(
                OSCADIA_API +
                "/api/crawl/queue",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            url:value
                        })
                }
            );

        const text =
            await response.text();

        let data;

        try{

            data =
                JSON.parse(text);

        }catch{

            alert(
                "서버에서 올바른 응답을 받지 못했습니다.\n\n" +
                "HTTP 상태: " +
                response.status
            );

            return;
        }

        if(
            !response.ok ||
            !data.ok
        ){

            alert(
                data.error ||
                "주소를 처리할 수 없습니다."
            );

            return;
        }

        saveVisitHistory({
            title:value,
            url:value
        });

        location.href =
            value;

    }catch(error){

        console.error(
            "주소 처리 오류:",
            error
        );

        alert(
            "주소를 처리하는 중 오류가 발생했습니다.\n\n" +
            error.message
        );
    }
}

addressGo.addEventListener(
    "click",
    goAddress
);

addressInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            goAddress();
        }
    }
);

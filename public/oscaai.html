<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>
<link rel="manifest" href="/apps/oscaai/manifest.json">
<meta name="theme-color" content="#5636d9">
<title>OscaAI - OSCADIA</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:
        Inter,
        "Noto Sans KR",
        Arial,
        sans-serif;
    background:#0b0d12;
    color:#f5f7fa;
}

body{
    display:flex;
    overflow:hidden;
}


/* =================================
   사이드바
================================= */

.sidebar{

    width:280px;

    background:#11141b;

    border-right:
        1px solid #252a34;

    display:flex;

    flex-direction:column;

    padding:18px;
}


.logo{

    font-size:24px;

    font-weight:800;

    letter-spacing:-1px;

    margin-bottom:20px;

    cursor:pointer;
}


.new-chat{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #303643;

    background:#181c24;

    color:white;

    cursor:pointer;

    font-size:14px;
}


.new-chat:hover{
    background:#202530;
}


.history{

    margin-top:20px;

    overflow:auto;

    flex:1;
}


.history-title{

    font-size:12px;

    color:#8d95a3;

    margin-bottom:10px;
}


.history-item{

    padding:10px;

    border-radius:8px;

    cursor:pointer;

    color:#d6d9df;

    font-size:13px;

    margin-bottom:4px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.history-item:hover{

    background:#1b2029;
}


.login-small{

    padding-top:15px;

    border-top:
        1px solid #252a34;
}


.login-small button{

    width:100%;

    padding:11px;

    border:0;

    border-radius:9px;

    background:#f0c62e;

    color:#111;

    font-weight:700;

    cursor:pointer;
}


/* =================================
   메인
================================= */

.main{

    flex:1;

    display:flex;

    flex-direction:column;

    min-width:0;
}


.topbar{

    height:60px;

    border-bottom:
        1px solid #252a34;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 22px;
}


.title{

    font-size:18px;

    font-weight:700;
}


.status{

    font-size:12px;

    color:#8d95a3;
}


/* =================================
   채팅
================================= */

.chat{

    flex:1;

    overflow-y:auto;

    padding:
        30px
        20px
        150px;
}


.welcome{

    max-width:760px;

    margin:
        100px auto 0;

    text-align:center;
}


.welcome h1{

    font-size:40px;

    margin-bottom:12px;
}


.welcome p{

    color:#9aa2b1;

    line-height:1.7;
}


.message{

    max-width:900px;

    margin:
        0 auto 24px;

    display:flex;

    gap:14px;
}


.avatar{

    width:34px;

    height:34px;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex:none;

    font-size:12px;

    font-weight:800;
}


.message.user
.avatar{

    background:#f0c62e;

    color:#111;
}


.message.ai
.avatar{

    background:#7057ff;

    color:white;
}


.content{

    flex:1;

    min-width:0;

    line-height:1.7;

    white-space:pre-wrap;

    word-break:break-word;
}


.source-box{

    margin-top:15px;

    border:
        1px solid #292f3a;

    border-radius:10px;

    padding:12px;

    background:#11151c;
}


.source-title{

    font-size:12px;

    color:#8f98a7;

    margin-bottom:8px;
}


.source{

    display:block;

    padding:6px 0;

    color:#aeb7c7;

    font-size:12px;

    text-decoration:none;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


.source:hover{

    color:white;
}


/* =================================
   입력
================================= */

.input-area{

    position:fixed;

    bottom:0;

    left:280px;

    right:0;

    padding:
        20px
        20px
        25px;

    background:
        linear-gradient(
            transparent,
            #0b0d12 30%
        );
}


.input-box{

    max-width:900px;

    margin:auto;

    border:
        1px solid #343b48;

    background:#171b23;

    border-radius:15px;

    display:flex;

    align-items:flex-end;

    padding:8px;
}


textarea{

    flex:1;

    min-height:48px;

    max-height:180px;

    resize:none;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    padding:
        12px;

    font-size:15px;

    font-family:inherit;
}


.send{

    width:44px;

    height:44px;

    border:0;

    border-radius:10px;

    background:#f0c62e;

    cursor:pointer;

    font-weight:800;
}


.send:disabled{

    opacity:.4;

    cursor:not-allowed;
}


/* =================================
   모달
================================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.65);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:100;
}


.modal.show{

    display:flex;
}


.modal-box{

    width:
        min(420px, calc(100% - 30px));

    background:#171b23;

    border:
        1px solid #343b48;

    border-radius:16px;

    padding:25px;
}


.modal-box h2{

    margin-top:0;
}


.modal-box input{

    width:100%;

    padding:13px;

    margin-top:10px;

    border:
        1px solid #353c49;

    border-radius:9px;

    background:#0e1117;

    color:white;

    outline:none;
}


.modal-box button{

    width:100%;

    padding:13px;

    margin-top:12px;

    border:0;

    border-radius:9px;

    background:#f0c62e;

    color:#111;

    font-weight:700;

    cursor:pointer;
}


.modal-message{

    margin-top:12px;

    font-size:13px;

    color:#aeb6c5;

    line-height:1.5;
}


/* =================================
   모바일
================================= */

@media(max-width:700px){

    .sidebar{

        display:none;
    }

    .input-area{

        left:0;
    }

    .chat{

        padding:
            20px
            12px
            130px;
    }

    .welcome{

        margin-top:80px;
    }

    .welcome h1{

        font-size:30px;
    }

    .topbar{

        padding:
            0 15px;
    }

}

</style>

</head>

<body>


<!-- =================================
     사이드바
================================= -->

<aside class="sidebar">

    <div
        class="logo"
        onclick="location.href='/oscadia.html'"
    >
        OSCADIA
    </div>

    <button
        class="new-chat"
        onclick="newChat()"
    >
        + 새 대화
    </button>

    <div class="history">

        <div class="history-title">
            대화 기록
        </div>

        <div id="historyList"></div>

    </div>

    <div class="login-small">

        <button
            id="loginButton"
            onclick="openLogin()"
        >
            OSmail로 로그인
        </button>

    </div>

</aside>


<!-- =================================
     메인
================================= -->

<main class="main">

    <header class="topbar">

        <div class="title">
            OscaAI
        </div>

        <div
            class="status"
            id="status"
        >
            게스트 모드
        </div>

    </header>


    <section
        class="chat"
        id="chat"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                OscaAI
            </h1>

            <p>
                OSCADIA의 검색 데이터를 참고하여
                답변하는 AI입니다.
            </p>

            <p>
                로그인하지 않아도 사용할 수 있습니다.
                OSmail로 로그인하면 대화 기록이 저장됩니다.
            </p>

        </div>

    </section>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="OscaAI에게 물어보세요..."
                rows="1"
            ></textarea>

            <button
                class="send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>

    </div>

</main>


<!-- =================================
     로그인 모달
================================= -->

<div
    class="modal"
    id="loginModal"
>

    <div class="modal-box">

        <h2>
            OSmail 로그인
        </h2>

        <p>
            OscaAI의 대화 기록을 저장하려면
            OSmail 계정으로 로그인하세요.
        </p>

        <input
            id="osmailId"
            placeholder="OSmail ID"
            autocomplete="username"
        >

        <input
            id="osmailPassword"
            type="password"
            placeholder="비밀번호"
            autocomplete="current-password"
        >

        <button
            onclick="requestCode()"
        >
            인증 코드 받기
        </button>

        <input
            id="verificationCode"
            placeholder="6자리 인증 코드"
            maxlength="6"
            inputmode="numeric"
            style="display:none"
        >

        <button
            id="verifyButton"
            onclick="verifyCode()"
            style="display:none"
        >
            로그인
        </button>

        <div
            class="modal-message"
            id="loginMessage"
        ></div>

        <button
            onclick="closeLogin()"
            style="
                background:#252b35;
                color:white;
            "
        >
            닫기
        </button>

    </div>

</div>


<script>

const API =
    "https://oscadia-api.onrender.com";


let sessionToken =
    localStorage.getItem(
        "oscaai_session"
    );


let conversationId =
    localStorage.getItem(
        "oscaai_conversation"
    );


let guestHistory = [];


let requestId = null;


/* =================================
   상태
================================= */

function updateStatus(){

    const status =
        document.getElementById(
            "status"
        );

    const button =
        document.getElementById(
            "loginButton"
        );


    if(sessionToken){

        status.textContent =
            "OSmail 로그인됨";

        button.textContent =
            "로그아웃";

        button.onclick =
            logout;

    }else{

        status.textContent =
            "게스트 모드";

        button.textContent =
            "OSmail로 로그인";

        button.onclick =
            openLogin;
    }
}


/* =================================
   로그인 모달
================================= */

function openLogin(){

    document
        .getElementById(
            "loginModal"
        )
        .classList.add(
            "show"
        );
}


function closeLogin(){

    document
        .getElementById(
            "loginModal"
        )
        .classList.remove(
            "show"
        );
}


/* =================================
   인증코드 요청
================================= */

async function requestCode(){

    const osmailId =
        document
            .getElementById(
                "osmailId"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "osmailPassword"
            )
            .value;


    const message =
        document
            .getElementById(
                "loginMessage"
            );


    if(!osmailId || !password){

        message.textContent =
            "OSmail ID와 비밀번호를 입력하세요.";

        return;
    }


    message.textContent =
        "인증 코드를 보내는 중...";


    try{

        const response =
            await fetch(
                API +
                "/api/oscaai/auth/request-code",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            osmailId,

                            password

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.ok){

            throw new Error(
                data.error ||
                "인증 코드 요청 실패"
            );
        }


        requestId =
            data.requestId;


        document
            .getElementById(
                "verificationCode"
            )
            .style.display =
                "block";


        document
            .getElementById(
                "verifyButton"
            )
            .style.display =
                "block";


        message.textContent =
            "OSmail 받은편지함에 6자리 인증 코드가 도착했습니다.";

    }catch(error){

        message.textContent =
            error.message;
    }
}


/* =================================
   인증코드 확인
================================= */

async function verifyCode(){

    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();


    const message =
        document
            .getElementById(
                "loginMessage"
            );


    if(!requestId){

        message.textContent =
            "먼저 인증 코드를 요청하세요.";

        return;
    }


    if(!/^\d{6}$/.test(code)){

        message.textContent =
            "6자리 인증 코드를 입력하세요.";

        return;
    }


    message.textContent =
        "로그인 중...";


    try{

        const response =
            await fetch(
                API +
                "/api/oscaai/auth/verify-code",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            requestId,

                            code

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.ok){

            throw new Error(
                data.error ||
                "로그인 실패"
            );
        }


        sessionToken =
            data.token;


        localStorage.setItem(
            "oscaai_session",
            sessionToken
        );


        closeLogin();


        updateStatus();


        loadHistory();


        document
            .getElementById(
                "loginMessage"
            )
            .textContent =
                "";


    }catch(error){

        message.textContent =
            error.message;
    }
}


/* =================================
   로그아웃
================================= */

async function logout(){

    try{

        await fetch(
            API +
            "/api/oscaai/auth/logout",
            {

                method:"POST",

                headers:{

                    Authorization:
                        "Bearer " +
                        sessionToken
                }
            }
        );

    }catch{}

    sessionToken =
        null;

    conversationId =
        null;

    localStorage.removeItem(
        "oscaai_session"
    );

    localStorage.removeItem(
        "oscaai_conversation"
    );

    updateStatus();

    document
        .getElementById(
            "historyList"
        )
        .innerHTML =
            "";

}


/* =================================
   메시지 추가
================================= */

function addMessage(
    role,
    text,
    sources=[]
){

    const welcome =
        document.getElementById(
            "welcome"
        );

    if(welcome){

        welcome.remove();
    }


    const chat =
        document.getElementById(
            "chat"
        );


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        role;


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "YOU"
            : "AI";


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "content";

    content.textContent =
        text;


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );


    if(
        role === "ai" &&
        sources.length
    ){

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "source-box";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "source-title";

        title.textContent =
            "OSCADIA 검색 자료";


        box.appendChild(
            title
        );


        sources
            .slice(0,5)
            .forEach(
                source => {

                    const a =
                        document.createElement(
                            "a"
                        );

                    a.className =
                        "source";

                    a.href =
                        source.url;

                    a.target =
                        "_blank";

                    a.rel =
                        "noopener noreferrer";

                    a.textContent =
                        source.title ||
                        source.url;

                    box.appendChild(
                        a
                    );
                }
            );


        content.appendChild(
            box
        );
    }


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =================================
   채팅
================================= */

async function sendMessage(){

    const input =
        document
            .getElementById(
                "messageInput"
            );


    const button =
        document
            .getElementById(
                "sendButton"
            );


    const message =
        input.value.trim();


    if(!message){

        return;
    }


    input.value = "";

    button.disabled =
        true;


    addMessage(
        "user",
        message
    );


    guestHistory.push({

        role:
            "user",

        content:
            message
    });


    try{

        const headers = {

            "Content-Type":
                "application/json"
        };


        if(sessionToken){

            headers.Authorization =
                "Bearer " +
                sessionToken;
        }


        const response =
            await fetch(
                API +
                "/api/oscaai/chat",
                {

                    method:"POST",

                    headers,

                    body:
                        JSON.stringify({

                            message,

                            conversationId,

                            guestHistory:
                                sessionToken
                                    ? undefined
                                    : guestHistory
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.ok){

            throw new Error(
                data.error ||
                "AI 응답 실패"
            );
        }


        addMessage(
            "ai",
            data.answer,
            data.sources || []
        );


        guestHistory.push({

            role:
                "assistant",

            content:
                data.answer
        });


        if(
            data.conversationId
        ){

            conversationId =
                data.conversationId;


            localStorage.setItem(
                "oscaai_conversation",
                conversationId
            );
        }


        if(sessionToken){

            loadHistory();
        }

    }catch(error){

        addMessage(
            "ai",
            "오류가 발생했습니다.\n\n" +
            error.message
        );

    }finally{

        button.disabled =
            false;

        input.focus();
    }
}


/* =================================
   새 대화
================================= */

function newChat(){

    conversationId =
        null;

    guestHistory =
        [];


    localStorage.removeItem(
        "oscaai_conversation"
    );


    document
        .getElementById(
            "chat"
        )
        .innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                OscaAI
            </h1>

            <p>
                새로운 대화를 시작하세요.
            </p>

        </div>
    `;
}


/* =================================
   대화 기록
================================= */

async function loadHistory(){

    if(!sessionToken){

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/oscaai/history",
                {

                    headers:{

                        Authorization:
                            "Bearer " +
                            sessionToken
                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.ok){

            return;
        }


        const list =
            document
                .getElementById(
                    "historyList"
                );


        list.innerHTML =
            "";


        data.conversations
            .forEach(
                conversation => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "history-item";

                    item.textContent =
                        conversation.title ||
                        "새 대화";

                    item.onclick =
                        () =>
                            loadConversation(
                                conversation.id
                            );

                    list.appendChild(
                        item
                    );
                }
            );

    }catch{}
}


/* =================================
   특정 대화 불러오기
================================= */

async function loadConversation(
    id
){

    if(!sessionToken){

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/oscaai/history/" +
                encodeURIComponent(id),
                {

                    headers:{

                        Authorization:
                            "Bearer " +
                            sessionToken
                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.ok){

            return;
        }


        conversationId =
            id;


        localStorage.setItem(
            "oscaai_conversation",
            id
        );


        const chat =
            document.getElementById(
                "chat"
            );


        chat.innerHTML =
            "";


        guestHistory =
            [];


        data.messages
            .forEach(
                message => {

                    addMessage(

                        message.role ===
                            "assistant"
                            ? "ai"
                            : "user",

                        message.content
                    );

                    guestHistory.push({

                        role:
                            message.role,

                        content:
                            message.content
                    });
                }
            );

    }catch(error){

        console.error(
            error
        );
    }
}


/* =================================
   Enter
================================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* =================================
   시작
================================= */

updateStatus();

if(sessionToken){

    loadHistory();
}

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/apps/oscaai/sw.js")
    .catch(error => {
      console.error("OscaAI Service Worker:", error);
    });
}
</script>
</body>
</html>
